openapi: 3.1.1
info:
  title: Aether API
  version: 0.1.0
  description: >-
    Contrato inicial de la primera rebanada institucional. Toda operación protegida
    usa sesión de servidor y conserva un identificador de correlación.
  license:
    name: Proprietary
    identifier: LicenseRef-Aether-Proprietary
servers:
  - url: http://127.0.0.1:4000
    description: Desarrollo local
tags:
  - name: Health
    description: Disponibilidad del servicio.
  - name: Observability
    description: Señales operacionales sin datos institucionales.
  - name: Authentication
    description: Inicio OIDC, sesión opaca y cierre de sesión.
  - name: Organizations
    description: Contexto organizacional institucional.
  - name: Workspaces
    description: Espacios de trabajo con alcance explícito.
  - name: Temporary access
    description: Grants acotados por recurso y acción, con aprobación separada, caducidad y revocación.
  - name: Support access
    description: Acceso JIT a diagnósticos agregados, sin contenido institucional.
  - name: Initiatives
    description: Ciclo de vida de iniciativas antes de convertirse en proyectos.
  - name: Projects
    description: Compromisos ejecutables con trazabilidad de iniciativa y decisión.
  - name: Capacity
    description: Disponibilidad y asignación de esfuerzo planificado por período.
  - name: Audit
    description: Línea temporal autorizada de acciones y eventos.
  - name: Product metrics
    description: Agregados institucionales versionados, disponibles solo para administradores.
  - name: Outbox
    description: Recuperación administrativa y aislada de efectos durables fallidos.
  - name: Documents
    description: "Evidencia privada: carga en cuarentena y descarga con URL temporal autorizada."
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Consultar disponibilidad del servicio
      security: []
      responses:
        "200":
          description: Servicio disponible
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "429":
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      tags: [Observability]
      operationId: getOperationalMetrics
      summary: Consultar métricas agregadas del proceso
      description: Requiere token de infraestructura y nunca incluye usuarios, cuerpos ni tokens.
      security: [{ metricsToken: [] }]
      responses:
        "200":
          description: Métricas de proceso y outbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalMetrics"
        "401": { description: Token de infraestructura inválido o ausente. }
  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Consultar preparación de dependencias requeridas
      security: []
      responses:
        "200":
          description: Dependencias requeridas disponibles.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ready
        "503":
          description: Una dependencia requerida no está disponible.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: unavailable
  /auth/login:
    get:
      tags: [Authentication]
      operationId: beginLogin
      summary: Iniciar autorización OIDC con PKCE
      security: []
      responses:
        "302":
          description: Redirección al proveedor OIDC.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "429":
          $ref: "#/components/responses/Problem"
  /auth/account-management/status:
    get:
      tags: [Authentication]
      operationId: getAccountManagementStatus
      summary: Consultar disponibilidad del portal de cuenta OIDC
      description: Informa si el entorno delega recuperación, cambio de correo y vinculación de identidades al proveedor OIDC.
      security: []
      responses:
        "200":
          description: Estado de la integración de administración de cuenta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountManagementStatus"
        "429":
          $ref: "#/components/responses/Problem"
  /auth/account-management:
    get:
      tags: [Authentication]
      operationId: openAccountManagement
      summary: Abrir el portal de cuenta del proveedor OIDC
      description: Redirige a una URL fija y validada del mismo origen que el emisor OIDC; Aether no procesa credenciales ni códigos de recuperación.
      security: []
      responses:
        "302":
          description: Redirección al portal de cuenta del proveedor OIDC.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /auth/callback:
    get:
      tags: [Authentication]
      operationId: completeLogin
      summary: Completar callback OIDC de un solo uso
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "302":
          description: Sesión creada y redirección al cliente web.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
        "400":
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Consultar la sesión actual
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Sesión activa.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revocar la sesión actual
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Sesión revocada.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: Listar sesiones activas de la persona autenticada
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Sesiones activas sin tokens ni hashes.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionSummary" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/sessions/revoke-others:
    post:
      tags: [Authentication]
      operationId: revokeOtherSessions
      summary: Revocar las demás sesiones activas
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Número de sesiones revocadas.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /auth/sessions/{sessionId}/revoke:
    post:
      tags: [Authentication]
      operationId: revokeSession
      summary: Revocar una sesión propia concreta
      security: [{ cookieSession: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204": { description: Sesión revocada o ya inactiva. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: Listar las organizaciones a las que pertenece la persona autenticada
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Organizaciones visibles para la sesión.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Crear una organización
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organización creada
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organizationId}/policy:
    get:
      tags: [Organizations]
      operationId: getEffectiveTenancyPolicy
      summary: Consultar la política efectiva de una organización o workspace
      description: Devuelve cada valor con su origen explícito y no revela una política de otra organización.
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Política efectiva con herencia visible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveTenancyPolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Organizations]
      operationId: updateOrganizationPolicy
      summary: Configurar la política de la organización
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenancyPolicyValues" }
      responses:
        "200":
          description: Política actualizada y auditada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPolicy" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organizationId}/temporary-access-grants:
    get:
      tags: [Temporary access]
      operationId: listTemporaryAccessGrants
      summary: Listar grants temporales visibles para la persona autenticada
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Grants propios o, para administradores, todos los grants de la organización.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TemporaryAccessGrant" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Temporary access]
      operationId: requestTemporaryAccessGrant
      summary: Solicitar acceso temporal a un recurso y una acción exactos
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestTemporaryAccessGrant" }
      responses:
        "201":
          description: Grant pendiente de aprobación independiente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryAccessGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/support-access-grants:
    get:
      tags: [Support access]
      operationId: listSupportAccessGrants
      summary: Listar solicitudes JIT visibles para soporte u owners de la organización
      security: [{ cookieSession: [] }]
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Solicitudes propias o todas las de la organización para sus administradores.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportAccessGrant" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Support access]
      operationId: requestSupportAccessGrant
      summary: Solicitar acceso JIT de soporte para la identidad elegible autenticada
      description: Requiere autenticación reciente; la solicitud no concede acceso hasta ser aprobada.
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestSupportAccessGrant" }
      responses:
        "201":
          description: Solicitud pendiente de aprobación por un owner distinto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAccessGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/support-access-grants/{grantId}/approve:
    post:
      tags: [Support access]
      operationId: approveSupportAccessGrant
      summary: Aprobar como owner una solicitud JIT de otro actor
      description: Requiere autenticación reciente.
      security: [{ cookieSession: [] }]
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAccessGrantContext" }
      responses:
        "200":
          description: Acceso JIT activo por un máximo total de una hora desde la solicitud.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAccessGrant" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/support-access-grants/{grantId}/revoke:
    post:
      tags: [Support access]
      operationId: revokeSupportAccessGrant
      summary: Revocar anticipadamente un acceso JIT
      description: Puede revocarlo el owner de la organización o el propio operador; requiere autenticación reciente.
      security: [{ cookieSession: [] }]
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeSupportAccessGrant" }
      responses:
        "200":
          description: Acceso revocado y no utilizable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAccessGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/support/organizations/{organizationId}/diagnostics:
    get:
      tags: [Support access]
      operationId: getOrganizationSupportDiagnostic
      summary: Consultar el diagnóstico técnico agregado permitido por un JIT activo
      description: Requiere autenticación reciente y audita cada consulta; no devuelve nombres, correos, archivos ni contenido institucional.
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Agregados mínimos de estado operativo.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationSupportDiagnostic" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organizationId}/temporary-access-grants/{grantId}/approve:
    post:
      tags: [Temporary access]
      operationId: approveTemporaryAccessGrant
      summary: Aprobar un grant pendiente como owner distinto del solicitante
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Grant activo hasta su expiración o revocación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryAccessGrant" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organizationId}/temporary-access-grants/{grantId}/revoke:
    post:
      tags: [Temporary access]
      operationId: revokeTemporaryAccessGrant
      summary: Revocar anticipadamente un grant temporal
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeTemporaryAccessGrant" }
      responses:
        "200":
          description: Grant revocado y no utilizable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryAccessGrant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organizationId}/workspaces/{workspaceId}/policy-override:
    put:
      tags: [Workspaces]
      operationId: setWorkspacePolicyOverride
      summary: Configurar una excepción visible de política para un workspace
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/WorkspacePolicyOverrideRequest" }
      responses:
        "200":
          description: Excepción configurada y auditada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePolicyOverride" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Workspaces]
      operationId: clearWorkspacePolicyOverride
      summary: Retirar la excepción de política de un workspace
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Excepción retirada y auditada. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/organizations/{organizationId}/workspaces:
    get:
      tags: [Workspaces]
      operationId: listOrganizationWorkspaces
      summary: Listar workspaces visibles dentro de una organización
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Workspaces autorizados para la persona autenticada.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Crear un workspace
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace creado
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Obtener un workspace dentro de su organización
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Workspace autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organizationId}/workspaces/{workspaceId}/archive:
    post:
      tags: [Workspaces]
      operationId: archiveWorkspace
      summary: Archivar un workspace conservando su historia
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CsrfToken"
