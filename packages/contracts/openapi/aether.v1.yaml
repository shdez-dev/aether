        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginDocumentUploadRequest" }
      responses:
        "201": { description: URL firmada PUT de corta vida para cuarentena. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents:
    get:
      tags: [Documents]
      operationId: listDocumentsForResource
      summary: Listar metadatos de evidencia autorizada
      security: [{ cookieSession: [] }]
      parameters:
        - name: resourceType
          in: query
          required: true
          schema:
            { type: string, enum: [initiative, evaluation, decision, project] }
        - name: resourceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Versiones de documento, sin claves de almacenamiento.
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/DocumentVersion" },
                }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents/{documentId}/versions/{versionId}/complete:
    post:
      tags: [Documents]
      operationId: completeDocumentUpload
      summary: Verificar y publicar una carga en cuarentena
      security: [{ cookieSession: [] }]
      parameters:
        - {
            name: documentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Documento publicado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVersion" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents/{documentId}/replacements:
    post:
      tags: [Documents]
      operationId: beginDocumentReplacement
      summary: Crear una versión de reemplazo sin borrar la evidencia anterior
      security: [{ cookieSession: [] }]
      parameters:
        - {
            name: documentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/BeginDocumentReplacementRequest" }
      responses:
        "201": { description: Nueva versión en cuarentena. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents/{documentId}/versions/{versionId}/withdraw:
    post:
      tags: [Documents]
      operationId: withdrawDocumentVersion
      summary: Retirar evidencia vigente sin modificar decisiones históricas
      security: [{ cookieSession: [] }]
      parameters:
        - {
            name: documentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/WithdrawDocumentVersionRequest" }
      responses:
        "200": { description: Evidencia retirada y auditada. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents/{documentId}/versions/{versionId}/restore:
    post:
      tags: [Documents]
      operationId: restoreDocumentVersion
      summary: Restaurar una versión histórica como nueva cabeza, reescaneada antes de publicar
      security: [{ cookieSession: [] }]
      parameters:
        - {
            name: documentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Nueva versión en espera de escaneo. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents/{documentId}/versions/{versionId}/download:
    get:
      tags: [Documents]
      operationId: getDocumentDownloadUrl
      summary: Emitir una URL temporal de descarga tras autorizar cada solicitud
      security: [{ cookieSession: [] }]
      parameters:
        - {
            name: documentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: URL temporal privada. }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: aether_session
    metricsToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationContextId:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Debe coincidir con la cookie no autenticante `aether_csrf`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    CorrelationId:
      description: Identificador que conecta solicitud, logs, auditoría y eventos.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error estructurado y seguro.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    AccountManagementStatus:
      type: object
      additionalProperties: false
      required: [available, authority]
      properties:
        available: { type: boolean }
        authority: { type: string, const: oidc-provider }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, organizationType, timezone, locale, policy]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        organizationType:
          { type: string, enum: [personal, business, institutional] }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        locale: { type: string, minLength: 2, maxLength: 16 }
        policy: { $ref: "#/components/schemas/TenancyPolicyValues" }
    Organization:
      type: object
      required: [id, name, organizationType, timezone, locale, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        organizationType:
          {
            type: [string, "null"],
            enum: [personal, business, institutional, null],
          }
        timezone: { type: string }
        locale: { type: string }
        version: { type: integer, minimum: 0 }
    RequestTemporaryAccessGrant:
      type: object
      additionalProperties: false
      required:
        [
          workspaceId,
          resourceType,
          resourceId,
          action,
          granteeActorId,
          reason,
          expiresInMinutes,
        ]
      properties:
        workspaceId: { type: string, format: uuid }
        resourceType:
          type: string
          enum: [workspace, initiative, evaluation, decision, project, document]
        resourceId: { type: string, format: uuid }
        action: { type: string, enum: [read, contribute] }
        granteeActorId: { type: string, minLength: 1, maxLength: 255 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expiresInMinutes: { type: integer, minimum: 1, maximum: 480 }
    RevokeTemporaryAccessGrant:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    TemporaryAccessGrant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          workspaceId,
          resourceType,
          resourceId,
          action,
          granteeActorId,
          requestedByActorId,
          approvedByActorId,
          reason,
          createdAt,
          expiresAt,
          approvedAt,
          revokedAt,
          revokedByActorId,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        resourceType:
          type: string
          enum: [workspace, initiative, evaluation, decision, project, document]
        resourceId: { type: string, format: uuid }
        action: { type: string, enum: [read, contribute] }
        granteeActorId: { type: string }
        requestedByActorId: { type: string }
        approvedByActorId: { type: [string, "null"] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        revokedByActorId: { type: [string, "null"] }
        status: { type: string, enum: [pending, active, expired, revoked] }
    RequestSupportAccessGrant:
      type: object
      additionalProperties: false
      required: [organizationId, reason, expiresInMinutes]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expiresInMinutes: { type: integer, minimum: 1, maximum: 60 }
    SupportAccessGrantContext:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
    RevokeSupportAccessGrant:
      type: object
      additionalProperties: false
      required: [organizationId, reason]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    SupportAccessGrant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          supportActorId,
          requestedByActorId,
          approvedByActorId,
          reason,
          createdAt,
          expiresAt,
          approvedAt,
          revokedAt,
          revokedByActorId,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        supportActorId: { type: string }
        requestedByActorId: { type: string }
        approvedByActorId: { type: [string, "null"] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        revokedByActorId: { type: [string, "null"] }
        status: { type: string, enum: [pending, active, expired, revoked] }
    OrganizationSupportDiagnostic:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          generatedAt,
          workspaces,
          memberships,
          delivery,
          policyConfigured,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        workspaces:
          type: object
          additionalProperties: false
          required: [active, archived]
          properties:
            active: { type: integer, minimum: 0 }
            archived: { type: integer, minimum: 0 }
        memberships:
          type: object
          additionalProperties: false
          required: [active, suspended, revoked]
          properties:
            active: { type: integer, minimum: 0 }
            suspended: { type: integer, minimum: 0 }
            revoked: { type: integer, minimum: 0 }
        delivery:
          type: object
          additionalProperties: false
          required: [pendingOutboxEvents, deadLetters]
          properties:
            pendingOutboxEvents: { type: integer, minimum: 0 }
            deadLetters: { type: integer, minimum: 0 }
        policyConfigured: { type: boolean }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [organizationId, name, mode]
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        mode: { type: string, enum: [personal, team, institutional] }
    Workspace:
      type: object
      required:
        [
          id,
          organizationId,
          name,
          mode,
          version,
          status,
          archivedAt,
          archivedByActorId,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        mode: { type: string, enum: [personal, team, institutional] }
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, archived] }
        archivedAt: { type: [string, "null"], format: date-time }
        archivedByActorId: { type: [string, "null"] }
