        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/WithdrawDocumentVersionRequest" }
      responses:
        "200": { description: Evidencia retirada y auditada. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents/{documentId}/versions/{versionId}/restore:
    post:
      tags: [Documents]
      operationId: restoreDocumentVersion
      summary: Restaurar una versión histórica como nueva cabeza, reescaneada antes de publicar
      security: [{ cookieSession: [] }]
      parameters:
        - {
            name: documentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Nueva versión en espera de escaneo. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/documents/{documentId}/versions/{versionId}/download:
    get:
      tags: [Documents]
      operationId: getDocumentDownloadUrl
      summary: Emitir una URL temporal de descarga tras autorizar cada solicitud
      security: [{ cookieSession: [] }]
      parameters:
        - {
            name: documentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: URL temporal privada. }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: aether_session
    metricsToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationContextId:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Debe coincidir con la cookie no autenticante `aether_csrf`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    CorrelationId:
      description: Identificador que conecta solicitud, logs, auditoría y eventos.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error estructurado y seguro.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    AccountManagementStatus:
      type: object
      additionalProperties: false
      required: [available, authority]
      properties:
        available: { type: boolean }
        authority: { type: string, const: oidc-provider }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, organizationType, timezone, locale, policy]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        organizationType:
          { type: string, enum: [personal, business, institutional] }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        locale: { type: string, minLength: 2, maxLength: 16 }
        policy: { $ref: "#/components/schemas/TenancyPolicyValues" }
    Organization:
      type: object
      required: [id, name, organizationType, timezone, locale, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        organizationType:
          {
            type: [string, "null"],
            enum: [personal, business, institutional, null],
          }
        timezone: { type: string }
        locale: { type: string }
        version: { type: integer, minimum: 0 }
    RequestTemporaryAccessGrant:
      type: object
      additionalProperties: false
      required:
        [
          workspaceId,
          resourceType,
          resourceId,
          action,
          granteeActorId,
          reason,
          expiresInMinutes,
        ]
      properties:
        workspaceId: { type: string, format: uuid }
        resourceType:
          type: string
          enum: [workspace, initiative, evaluation, decision, project, document]
        resourceId: { type: string, format: uuid }
        action: { type: string, enum: [read, contribute] }
        granteeActorId: { type: string, minLength: 1, maxLength: 255 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expiresInMinutes: { type: integer, minimum: 1, maximum: 480 }
    RevokeTemporaryAccessGrant:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    TemporaryAccessGrant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          workspaceId,
          resourceType,
          resourceId,
          action,
          granteeActorId,
          requestedByActorId,
          approvedByActorId,
          reason,
          createdAt,
          expiresAt,
          approvedAt,
          revokedAt,
          revokedByActorId,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        resourceType:
          type: string
          enum: [workspace, initiative, evaluation, decision, project, document]
        resourceId: { type: string, format: uuid }
        action: { type: string, enum: [read, contribute] }
        granteeActorId: { type: string }
        requestedByActorId: { type: string }
        approvedByActorId: { type: [string, "null"] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        revokedByActorId: { type: [string, "null"] }
        status: { type: string, enum: [pending, active, expired, revoked] }
    RequestSupportAccessGrant:
      type: object
      additionalProperties: false
      required: [organizationId, reason, expiresInMinutes]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expiresInMinutes: { type: integer, minimum: 1, maximum: 60 }
    SupportAccessGrantContext:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
    RevokeSupportAccessGrant:
      type: object
      additionalProperties: false
      required: [organizationId, reason]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    SupportAccessGrant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          supportActorId,
          requestedByActorId,
          approvedByActorId,
          reason,
          createdAt,
          expiresAt,
          approvedAt,
          revokedAt,
          revokedByActorId,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        supportActorId: { type: string }
        requestedByActorId: { type: string }
        approvedByActorId: { type: [string, "null"] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        revokedByActorId: { type: [string, "null"] }
        status: { type: string, enum: [pending, active, expired, revoked] }
    OrganizationSupportDiagnostic:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          generatedAt,
          workspaces,
          memberships,
          delivery,
          policyConfigured,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        workspaces:
          type: object
          additionalProperties: false
          required: [active, archived]
          properties:
            active: { type: integer, minimum: 0 }
            archived: { type: integer, minimum: 0 }
        memberships:
          type: object
          additionalProperties: false
          required: [active, suspended, revoked]
          properties:
            active: { type: integer, minimum: 0 }
            suspended: { type: integer, minimum: 0 }
            revoked: { type: integer, minimum: 0 }
        delivery:
          type: object
          additionalProperties: false
          required: [pendingOutboxEvents, deadLetters]
          properties:
            pendingOutboxEvents: { type: integer, minimum: 0 }
            deadLetters: { type: integer, minimum: 0 }
        policyConfigured: { type: boolean }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [organizationId, name, mode]
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        mode: { type: string, enum: [personal, team, institutional] }
    Workspace:
      type: object
      required:
        [
          id,
          organizationId,
          name,
          mode,
          version,
          status,
          archivedAt,
          archivedByActorId,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        mode: { type: string, enum: [personal, team, institutional] }
        version: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, archived] }
        archivedAt: { type: [string, "null"], format: date-time }
        archivedByActorId: { type: [string, "null"] }
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        memberActorIds:
          type: array
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 255 }
    Team:
      type: object
      additionalProperties: false
      required: [id, organizationId, workspaceId, name, version, memberActorIds]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 0 }
        memberActorIds:
          type: array
          items: { type: string }
    ReplaceTeamMembersRequest:
      type: object
      additionalProperties: false
      required: [memberActorIds]
      properties:
        memberActorIds:
          type: array
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 255 }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, organizationRole]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        organizationRole: { type: string, enum: [admin, member] }
        workspaceIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        workspaceRole:
          { type: string, enum: [admin, member, viewer], default: member }
        expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
    TransferOrganizationOwnershipRequest:
      type: object
      additionalProperties: false
      required: [targetActorId]
      properties:
        targetActorId:
          type: string
          minLength: 1
          maxLength: 255
    ChangeMembershipStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [suspended, revoked] }
    ReassignMemberResponsibilitiesRequest:
      type: object
      additionalProperties: false
      required: [replacementActorId]
      properties:
        replacementActorId: { type: string, minLength: 1, maxLength: 255 }
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 255 }
    Invitation:
      type: object
      required:
        [
          id,
          organizationId,
          email,
          organizationRole,
          workspaceIds,
          workspaceRole,
          expiresAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string, format: email }
        organizationRole: { type: string, enum: [owner, admin, member] }
        workspaceIds:
          type: array
          items: { type: string, format: uuid }
        workspaceRole: { type: string, enum: [admin, member, viewer] }
        expiresAt: { type: string, format: date-time }
    AccessCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          canReadOrganization,
          canManageOrganization,
          canCreateWorkspace,
          canReadWorkspace,
          canManageWorkspace,
          canInviteMembers,
        ]
      properties:
        canReadOrganization: { type: boolean }
        canManageOrganization: { type: boolean }
        canCreateWorkspace: { type: boolean }
        canReadWorkspace: { type: boolean }
        canManageWorkspace: { type: boolean }
        canInviteMembers: { type: boolean }
    TenancyPolicyValues:
      type: object
      additionalProperties: false
      required: [dataResidencyRegion, retentionDays]
      properties:
        dataResidencyRegion: { type: string, minLength: 2, maxLength: 64 }
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        businessHours: { $ref: "#/components/schemas/BusinessHoursPolicy" }
    BusinessHoursWindow:
      type: object
      additionalProperties: false
      required: [dayOfWeek, startMinute, endMinute]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        startMinute: { type: integer, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, minimum: 1, maximum: 1440 }
    BusinessHoursPolicy:
      type: object
      additionalProperties: false
      required: [mode, timezone, windows]
      properties:
        mode: { type: string, enum: [disabled, audit, enforce] }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        windows:
          type: array
          maxItems: 21
          items: { $ref: "#/components/schemas/BusinessHoursWindow" }
    OrganizationPolicy:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          dataResidencyRegion,
          retentionDays,
          businessHours,
          version,
          updatedByActorId,
          updatedAt,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        dataResidencyRegion: { type: string }
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        businessHours:
          allOf: [{ $ref: "#/components/schemas/BusinessHoursPolicy" }]
          nullable: true
        version: { type: integer, minimum: 0 }
        updatedByActorId: { type: string }
        updatedAt: { type: string, format: date-time }
    WorkspacePolicyOverrideRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      required: [dataResidencyRegion, retentionDays]
      properties:
        dataResidencyRegion:
          { type: [string, "null"], minLength: 2, maxLength: 64 }
        retentionDays: { type: [integer, "null"], minimum: 1, maximum: 3650 }
        businessHours: { $ref: "#/components/schemas/BusinessHoursPolicy" }
    WorkspacePolicyOverride:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          workspaceId,
          dataResidencyRegion,
          retentionDays,
          businessHours,
          version,
          updatedByActorId,
          updatedAt,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        dataResidencyRegion: { type: [string, "null"] }
        retentionDays: { type: [integer, "null"] }
        businessHours:
          allOf: [{ $ref: "#/components/schemas/BusinessHoursPolicy" }]
          nullable: true
        version: { type: integer, minimum: 0 }
        updatedByActorId: { type: string }
        updatedAt: { type: string, format: date-time }
    EffectiveTenancyPolicy:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          workspaceId,
          dataResidencyRegion,
          retentionDays,
          businessHours,
          organizationPolicy,
          workspaceOverride,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        workspaceId: { type: [string, "null"], format: uuid }
        dataResidencyRegion:
          type: object
          required: [value, origin]
          properties:
            value: { type: string }
            origin: { type: string, enum: [organization, workspace] }
        businessHours:
          type: object
          required: [value, origin]
          properties:
            value: { $ref: "#/components/schemas/BusinessHoursPolicy" }
            origin: { type: string, enum: [default, organization, workspace] }
        retentionDays:
          type: object
          required: [value, origin]
          properties:
            value: { type: integer }
            origin: { type: string, enum: [organization, workspace] }
        organizationPolicy: { $ref: "#/components/schemas/OrganizationPolicy" }
        workspaceOverride:
          allOf:
            - $ref: "#/components/schemas/WorkspacePolicyOverride"
          nullable: true
    CreateInitiativeDraftRequest:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          workspaceId,
          title,
          problemStatement,
          expectedOutcome,
          classification,
          requestedPriority,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 255 }
        problemStatement: { type: string, minLength: 1, maxLength: 10000 }
        expectedOutcome: { type: string, minLength: 1, maxLength: 10000 }
        classification: { type: string, enum: [internal, confidential] }
        requestedPriority: { type: string, enum: [low, medium, high] }
    SetInitiativeOperationalPriorityRequest:
      type: object
      additionalProperties: false
      required: [organizationId, expectedVersion, operationalPriority]
      properties:
        organizationId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
        operationalPriority: { type: string, enum: [low, medium, high] }
    SubmitInitiativeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, standardId, results]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        standardId: { type: string, format: uuid }
        results:
          type: array
          maxItems: 100
          items:
            type: object
            required: [criterionId, assessment, evidence]
            properties:
              criterionId: { type: string, format: uuid }
              assessment:
                {
                  type: [string, "null"],
                  enum: [met, not_met, not_applicable, null],
                }
              evidence: { type: array, items: { type: string }, maxItems: 50 }
    UpdateInitiativeRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedVersion,
          title,
          problemStatement,
          expectedOutcome,
          classification,
          requestedPriority,
          operationalPriority,
        ]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 255 }
        problemStatement: { type: string, minLength: 1, maxLength: 10000 }
        expectedOutcome: { type: string, minLength: 1, maxLength: 10000 }
        classification: { type: string, enum: [internal, confidential] }
        requestedPriority: { type: string, enum: [low, medium, high] }
        operationalPriority:
          { type: [string, "null"], enum: [low, medium, high, null] }
    StartReviewRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, standardId, results]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        standardId: { type: string, format: uuid }
        results:
          type: array
          maxItems: 100
          items:
            type: object
            required: [criterionId, assessment, evidence]
            properties:
              criterionId: { type: string, format: uuid }
              assessment:
                {
                  type: [string, "null"],
                  enum: [met, not_met, not_applicable, null],
                }
              evidence: { type: array, items: { type: string }, maxItems: 50 }
    AnnulEvaluationRequest:
      type: object
      required: [organizationId, reason]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    AssignEvaluationReviewerRequest:
      type: object
      additionalProperties: false
      required: [organizationId, reviewerActorId]
      properties:
        organizationId: { type: string, format: uuid }
        reviewerActorId: { type: string, minLength: 1, maxLength: 255 }
    AbstainFromEvaluationReviewRequest:
      type: object
      additionalProperties: false
      required: [organizationId, reason]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ReassignEvaluationReviewRequest:
      type: object
      additionalProperties: false
      required: [organizationId, reviewerActorId, reason]
      properties:
        organizationId: { type: string, format: uuid }
        reviewerActorId: { type: string, minLength: 1, maxLength: 255 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    EscalateEvaluationReviewAbstentionRequest:
      type: object
      additionalProperties: false
      required: [organizationId, reason]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    DecideInitiativeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, evaluationId, outcome, rationale, evidence]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        evaluationId: { type: string, format: uuid }
        outcome:
          { type: string, enum: [approved, rejected, returned, cancelled] }
        rationale: { type: string, minLength: 1, maxLength: 10000 }
        supersedesDecisionId: { type: [string, "null"], format: uuid }
        evidence: { type: array, items: { type: string }, maxItems: 50 }
        nextReviewOn: { type: [string, "null"], format: date }
        conditions:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DecisionConditionInput" }
    DecisionConditionInput:
      type: object
      additionalProperties: false
      required: [description, responsibleActorId, dueOn]
      properties:
        description: { type: string, minLength: 1, maxLength: 2000 }
        responsibleActorId: { type: string, minLength: 1, maxLength: 255 }
        dueOn: { type: string, format: date }
    ExemptDecisionConditionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    FulfillDecisionConditionRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 2000 }
    EvaluationCriterion:
      type: object
      additionalProperties: false
      required: [id, code, name, description, weight]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        weight: { type: number, exclusiveMinimum: 0 }
    PublishEvaluationStandardRequest:
      type: object
      additionalProperties: false
      required: [organizationId, name, version, criteria]
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        version: { type: integer, minimum: 1 }
        criteria:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { $ref: "#/components/schemas/EvaluationCriterion" },
          }
    ActivateEvaluationStandardRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
    TriageCriterion:
      type: object
      additionalProperties: false
      required: [id, code, name, description, required]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        required: { type: boolean }
    PublishTriageStandardRequest:
      type: object
      additionalProperties: false
      required: [organizationId, name, version, criteria]
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        version: { type: integer, minimum: 1 }
        criteria:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/TriageCriterion" }
    ActivateTriageStandardRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
