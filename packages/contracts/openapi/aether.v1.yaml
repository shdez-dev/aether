  /v1/admin/product-metrics:
    get:
      tags: [Product metrics]
      operationId: getProductMetrics
      summary: Consultar métricas institucionales versionadas
      description: >-
        Disponible solo para owner y admin. Todas las series se calculan en UTC;
        el período es semiabierto y los porcentajes sin denominador se devuelven como null.
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - name: startsAt
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Inicio inclusivo; por defecto, 90 días antes de endsAt.
        - name: endsAt
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Fin exclusivo; por defecto, el instante de cálculo.
      responses:
        "200":
          description: Agregado aislado de la organización solicitada.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductMetrics" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/outbox/dead-letters:
