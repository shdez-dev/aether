        "200":
          description: Dead letters autorizadas de la organización.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutboxDeadLetter" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/admin/outbox/dead-letters/{eventId}/replay:
    post:
      tags: [Outbox]
      operationId: replayOutboxDeadLetter
      summary: Reencolar de forma auditable un efecto durable fallido
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
