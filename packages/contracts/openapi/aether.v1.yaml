openapi: 3.1.1
info:
  title: Aether API
  version: 0.1.0
  description: >-
    Contrato inicial de la primera rebanada institucional. Toda operación protegida
    usa sesión de servidor y conserva un identificador de correlación.
  license:
    name: Proprietary
    identifier: LicenseRef-Aether-Proprietary
servers:
  - url: http://127.0.0.1:4000
    description: Desarrollo local
tags:
  - name: Health
    description: Disponibilidad del servicio.
  - name: Authentication
    description: Inicio OIDC, sesión opaca y cierre de sesión.
  - name: Organizations
    description: Contexto organizacional institucional.
  - name: Workspaces
    description: Espacios de trabajo con alcance explícito.
  - name: Initiatives
    description: Ciclo de vida de iniciativas antes de convertirse en proyectos.
  - name: Audit
    description: Línea temporal autorizada de acciones y eventos.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Consultar disponibilidad del servicio
      security: []
      responses:
        "200":
          description: Servicio disponible
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "429":
          $ref: "#/components/responses/Problem"
  /auth/login:
    get:
      tags: [Authentication]
      operationId: beginLogin
      summary: Iniciar autorización OIDC con PKCE
      security: []
      responses:
        "302":
          description: Redirección al proveedor OIDC.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "429":
          $ref: "#/components/responses/Problem"
  /auth/callback:
    get:
      tags: [Authentication]
      operationId: completeLogin
      summary: Completar callback OIDC de un solo uso
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "302":
          description: Sesión creada y redirección al cliente web.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
        "400":
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Consultar la sesión actual
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Sesión activa.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revocar la sesión actual
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Sesión revocada.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Crear una organización
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organización creada
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Crear un workspace
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace creado
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Obtener un workspace dentro de su organización
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Workspace autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organizationId}/capabilities:
    get:
      tags: [Organizations]
      operationId: getAccessCapabilities
      summary: Consultar capacidades calculadas para un contexto
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: workspaceId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Capacidades calculadas por el servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCapabilities"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organizationId}/invitations:
    post:
      tags: [Organizations]
      operationId: createInvitation
      summary: Invitar una persona a la organización y workspaces acotados
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitación creada; el token se entrega exclusivamente por el canal de correo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/invitations/accept:
    post:
      tags: [Organizations]
      operationId: acceptInvitation
      summary: Aceptar una invitación vigente asociada al correo autenticado
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Membresías otorgadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/initiatives:
    get:
      tags: [Initiatives]
      operationId: listInitiatives
      summary: Listar iniciativas autorizadas de un workspace
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrganizationContextId"
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Iniciativas visibles en el contexto.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Initiative" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Initiatives]
      operationId: createInitiativeDraft
      summary: Crear un borrador de iniciativa
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInitiativeDraftRequest"
      responses:
        "201":
          description: Borrador de iniciativa creado
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/initiatives/{initiativeId}:
    get:
      tags: [Initiatives]
      operationId: getInitiative
      summary: Obtener una iniciativa autorizada
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InitiativeId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Iniciativa autorizada
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Initiatives]
      operationId: editInitiative
      summary: Editar un borrador de iniciativa
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InitiativeId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInitiativeRequest" }
      responses:
        "200":
          description: Borrador actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Initiative" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/initiatives/{initiativeId}/submit:
    post:
      tags: [Initiatives]
      operationId: submitInitiative
      summary: Presentar una iniciativa para triage
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InitiativeId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInitiativeRequest"
      responses:
        "200":
          description: Iniciativa presentada
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/initiatives/{initiativeId}/review:
    post:
      tags: [Initiatives]
      operationId: startInitiativeReview
      summary: Iniciar revisión institucional de una iniciativa presentada
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InitiativeId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartReviewRequest" }
      responses:
        "200":
          description: Iniciativa en revisión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Initiative" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/initiatives/{initiativeId}/decide:
    post:
      tags: [Initiatives]
      operationId: decideInitiative
      summary: Aprobar o rechazar una iniciativa en revisión
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InitiativeId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideInitiativeRequest" }
      responses:
        "200":
          description: Decisión registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Initiative" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/initiatives/{initiativeId}/audit-events:
    get:
      tags: [Audit]
      operationId: listInitiativeAuditEvents
      summary: Consultar la bitácora de una iniciativa autorizada
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/InitiativeId"
        - $ref: "#/components/parameters/OrganizationContextId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Eventos de creación, edición y cambios de estado.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InitiativeAuditEvent" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Consultar la línea temporal de auditoría
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Línea temporal autorizada
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: aether_session
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationContextId:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Debe coincidir con la cookie no autenticante `aether_csrf`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    CorrelationId:
      description: Identificador que conecta solicitud, logs, auditoría y eventos.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error estructurado y seguro.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, timezone, locale]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        locale: { type: string, minLength: 2, maxLength: 16 }
    Organization:
      type: object
      required: [id, name, timezone, locale, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        locale: { type: string }
        version: { type: integer, minimum: 0 }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [organizationId, name, mode]
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        mode: { type: string, enum: [personal, team, institutional] }
    Workspace:
      type: object
      required: [id, organizationId, name, mode, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        mode: { type: string, enum: [personal, team, institutional] }
        version: { type: integer, minimum: 0 }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, organizationRole]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        organizationRole: { type: string, enum: [admin, member] }
        workspaceIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        workspaceRole:
          { type: string, enum: [admin, member, viewer], default: member }
        expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 255 }
    Invitation:
      type: object
      required:
        [
          id,
          organizationId,
          email,
          organizationRole,
          workspaceIds,
          workspaceRole,
          expiresAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string, format: email }
        organizationRole: { type: string, enum: [owner, admin, member] }
        workspaceIds:
          type: array
          items: { type: string, format: uuid }
        workspaceRole: { type: string, enum: [admin, member, viewer] }
        expiresAt: { type: string, format: date-time }
    AccessCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          canReadOrganization,
          canManageOrganization,
          canCreateWorkspace,
          canReadWorkspace,
          canManageWorkspace,
          canInviteMembers,
        ]
      properties:
        canReadOrganization: { type: boolean }
        canManageOrganization: { type: boolean }
        canCreateWorkspace: { type: boolean }
        canReadWorkspace: { type: boolean }
        canManageWorkspace: { type: boolean }
        canInviteMembers: { type: boolean }
    CreateInitiativeDraftRequest:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          workspaceId,
          title,
          problemStatement,
          expectedOutcome,
          classification,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 255 }
        problemStatement: { type: string, minLength: 1, maxLength: 10000 }
        expectedOutcome: { type: string, minLength: 1, maxLength: 10000 }
        classification: { type: string, enum: [internal, confidential] }
    SubmitInitiativeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    UpdateInitiativeRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedVersion,
          title,
          problemStatement,
          expectedOutcome,
          classification,
        ]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 255 }
        problemStatement: { type: string, minLength: 1, maxLength: 10000 }
        expectedOutcome: { type: string, minLength: 1, maxLength: 10000 }
        classification: { type: string, enum: [internal, confidential] }
    StartReviewRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    DecideInitiativeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        decision: { type: string, enum: [approved, rejected] }
    Initiative:
      type: object
      required:
        [
          id,
          organizationId,
          workspaceId,
          title,
          problemStatement,
          expectedOutcome,
          classification,
          status,
          version,
          createdAt,
          updatedAt,
          allowedActions,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        title: { type: string }
        problemStatement: { type: string }
        expectedOutcome: { type: string }
        classification: { type: string, enum: [internal, confidential] }
        status:
          type: string
          enum: [draft, presented, under_review, approved, rejected, withdrawn]
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        allowedActions:
          type: array
          items: { type: string, enum: [edit, present, review, decide] }
    InitiativeAuditEvent:
      type: object
      required:
        [
          id,
          eventType,
          organizationId,
          workspaceId,
          initiativeId,
          actorId,
          correlationId,
          occurredAt,
          payload,
        ]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        initiativeId: { type: string, format: uuid }
        actorId: { type: string }
        correlationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        fromStatus:
          {
            type: [string, "null"],
            enum:
              [
                draft,
                presented,
                under_review,
                approved,
                rejected,
                withdrawn,
                null,
              ],
          }
        toStatus:
          {
            type: [string, "null"],
            enum:
              [
                draft,
                presented,
                under_review,
                approved,
                rejected,
                withdrawn,
                null,
              ],
          }
        payload: { type: object, additionalProperties: true }
    AuditEvent:
      type: object
      required:
        [
          eventId,
          eventType,
          occurredAt,
          aggregateId,
          aggregateType,
          aggregateVersion,
          organizationId,
          correlationId,
          schemaVersion,
          payload,
        ]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, example: initiative.submitted.v1 }
        occurredAt: { type: string, format: date-time }
        aggregateId: { type: string, format: uuid }
        aggregateType: { type: string, example: initiative }
        aggregateVersion: { type: integer, minimum: 1 }
        organizationId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        causationId: { type: string, format: uuid }
        schemaVersion: { type: integer, minimum: 1 }
        payload: { type: object, additionalProperties: true }
    Session:
      type: object
      required: [actorId, expiresAt]
      properties:
        actorId: { type: string }
        expiresAt: { type: string, format: date-time }
    ApiProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            [
              VALIDATION_ERROR,
              UNAUTHENTICATED,
              FORBIDDEN,
              NOT_FOUND,
              CONFLICT,
              PRECONDITION_FAILED,
              RATE_LIMITED,
              DEPENDENCY_UNAVAILABLE,
              INVITATION_INVALID_OR_EXPIRED,
              INTERNAL_ERROR,
            ]
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
