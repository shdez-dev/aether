        decidedCount: { type: integer, minimum: 0 }
        decisionsWithVerifiedEvidence: { type: integer, minimum: 0 }
        coveragePercent: { type: [number, "null"], minimum: 0, maximum: 100 }
    ConversionMetrics:
      type: object
      required:
        [
          approvedDecisions,
          projectsCreatedFromApprovedDecisions,
          conversionPercent,
        ]
      properties:
        approvedDecisions: { type: integer, minimum: 0 }
        projectsCreatedFromApprovedDecisions: { type: integer, minimum: 0 }
        conversionPercent: { type: [number, "null"], minimum: 0, maximum: 100 }
    ActiveProjectMetrics:
      type: object
      required:
        [
          activeOrBlockedCount,
          withAssignedLeadCount,
          withUpcomingMilestoneCount,
          staleForThirtyDaysCount,
        ]
      properties:
        activeOrBlockedCount: { type: integer, minimum: 0 }
        withAssignedLeadCount: { type: integer, minimum: 0 }
        withUpcomingMilestoneCount: { type: integer, minimum: 0 }
        staleForThirtyDaysCount: { type: integer, minimum: 0 }
    ClosureMetrics:
      type: object
      required: [closedCount, withLessonsLearnedCount, lessonsCoveragePercent]
      properties:
        closedCount: { type: integer, minimum: 0 }
        withLessonsLearnedCount: { type: integer, minimum: 0 }
        lessonsCoveragePercent:
          { type: [number, "null"], minimum: 0, maximum: 100 }
    OutboxDeadLetter:
      type: object
      required:
        [
          eventId,
          eventType,
          organizationId,
          aggregateId,
          aggregateType,
          aggregateVersion,
          correlationId,
          attempts,
          failedAt,
          lastError,
        ]
      properties:
        eventId: { type: string, format: uuid }
        eventType:
          type: string
          enum:
            [
              document.scan_requested.v1,
              project.created.v1,
              project.created_from_initiative.v1,
              project.status_changed.v1,
              project.milestone_added.v1,
              project.next_action_added.v1,
              project.deliverable_accepted.v1,
              project.closed.v1,
            ]
        organizationId: { type: string, format: uuid }
        aggregateId: { type: string, format: uuid }
        aggregateType: { type: string }
        aggregateVersion: { type: integer, minimum: 1 }
        correlationId: { type: string, format: uuid }
        attempts: { type: integer, minimum: 1 }
        failedAt: { type: string, format: date-time }
        lastError: { type: string }
    ReplayOutboxDeadLetterRequest:
      type: object
      additionalProperties: false
      required: [organizationId, reason]
      properties:
        organizationId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
    BeginDocumentUploadRequest:
      type: object
      additionalProperties: false
      required:
        [
          resourceType,
          resourceId,
          classification,
          fileName,
          contentType,
          contentLength,
          sha256,
        ]
      properties:
        resourceType:
          { type: string, enum: [initiative, evaluation, decision, project] }
        resourceId: { type: string, format: uuid }
        classification:
          { type: string, enum: [internal, confidential, restricted] }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType:
          {
            type: string,
            enum: [application/pdf, image/png, image/jpeg, text/plain],
          }
        contentLength: { type: integer, minimum: 1, maximum: 26214400 }
        sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    DocumentVersion:
      type: object
      required:
        [
          documentId,
          versionId,
          resourceType,
          resourceId,
          classification,
          versionNumber,
          fileName,
          contentType,
          byteLength,
          sha256,
          status,
          evidenceStatus,
          createdAt,
          publishedAt,
          retentionUntil,
          supersedesVersionId,
        ]
      properties:
        documentId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        resourceType:
          { type: string, enum: [initiative, evaluation, decision, project] }
        resourceId: { type: string, format: uuid }
        classification:
          { type: string, enum: [internal, confidential, restricted] }
        versionNumber: { type: integer, minimum: 1 }
        fileName: { type: string }
        contentType:
          {
            type: string,
            enum: [application/pdf, image/png, image/jpeg, text/plain],
          }
        byteLength: { type: integer, minimum: 1 }
        sha256: { type: string }
        status:
          {
            type: string,
            enum:
              [
                quarantined,
                pending_scan,
                published,
                rejected,
                withdrawn,
                superseded,
                purged,
              ],
          }
        evidenceStatus:
          { type: string, enum: [pending, valid, withdrawn, replaced] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        retentionUntil: { type: [string, "null"], format: date-time }
        supersedesVersionId: { type: [string, "null"], format: uuid }
    BeginDocumentReplacementRequest:
      type: object
      additionalProperties: false
      required:
        [replacedVersionId, fileName, contentType, contentLength, sha256]
      properties:
        replacedVersionId: { type: string, format: uuid }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType:
          {
            type: string,
            enum: [application/pdf, image/png, image/jpeg, text/plain],
          }
        contentLength: { type: integer, minimum: 1, maximum: 26214400 }
        sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    WithdrawDocumentVersionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        resourceId: { type: string, format: uuid }
        actorId: { type: string }
        organizationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        result: { type: string, enum: [succeeded, failed] }
        correlationId: { type: string, format: uuid }
        causationId: { type: [string, "null"], format: uuid }
        asyncEventId: { type: [string, "null"], format: uuid }
        payload: { type: object, additionalProperties: true }
    Session:
      type: object
      required: [actorId, expiresAt]
      properties:
        actorId: { type: string }
        expiresAt: { type: string, format: date-time }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastSeenAt, expiresAt, isCurrent]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
    OperationalMetrics:
      type: object
      additionalProperties: false
      required: [startedAt, http, outbox]
      properties:
        startedAt: { type: string, format: date-time }
        http:
          type: object
          required: [requests, failures, durationMsTotal]
          properties:
            requests: { type: integer, minimum: 0 }
            failures: { type: integer, minimum: 0 }
            durationMsTotal: { type: number, minimum: 0 }
        outbox:
          type: object
          required:
            [
              processed,
              retried,
              deadLettered,
              pending,
              processing,
              oldestPendingAgeSeconds,
            ]
          properties:
            processed: { type: integer, minimum: 0 }
            retried: { type: integer, minimum: 0 }
            deadLettered: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            processing: { type: integer, minimum: 0 }
            oldestPendingAgeSeconds: { type: [number, "null"], minimum: 0 }
    ApiProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, retryable, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            [
              VALIDATION_ERROR,
              UNAUTHENTICATED,
              FORBIDDEN,
              NOT_FOUND,
              CONFLICT,
              IDEMPOTENCY_KEY_REUSED,
              IDEMPOTENCY_REQUEST_IN_PROGRESS,
              PRECONDITION_FAILED,
              RATE_LIMITED,
              PAYLOAD_TOO_LARGE,
              DEPENDENCY_UNAVAILABLE,
              INVITATION_INVALID_OR_EXPIRED,
              OIDC_PROVIDER_UNAVAILABLE,
              RECENT_AUTH_REQUIRED,
              CONFLICT_OF_INTEREST,
              WORKSPACE_ARCHIVED,
              ACCOUNT_MANAGEMENT_UNAVAILABLE,
              BUSINESS_HOURS_ENFORCED,
              GRANT_RESOURCE_NOT_FOUND,
              GRANT_SEPARATION_OF_DUTIES,
              GRANT_NOT_PENDING,
              GRANT_NOT_ACTIVE,
              GRANT_EXPIRED,
              GRANT_INVALID_REQUEST,
              SUPPORT_OPERATOR_NOT_ELIGIBLE,
              SUPPORT_ACCESS_INVALID_REQUEST,
              SUPPORT_ACCESS_SEPARATION_OF_DUTIES,
              SUPPORT_ACCESS_NOT_PENDING,
              SUPPORT_ACCESS_NOT_ACTIVE,
              SUPPORT_ACCESS_EXPIRED,
              SUPPORT_ACCESS_DENIED,
              TARGET_MUST_BE_DIFFERENT,
              TARGET_MUST_BE_MEMBER,
              TARGET_NOT_MEMBER,
              TARGET_IS_OWNER,
              TARGET_HAS_OPEN_RESPONSIBILITIES,
              REPLACEMENT_NOT_ACTIVE,
              REPLACEMENT_CONFLICTS_WITH_PROJECT_ROLE,
              INTERNAL_ERROR,
            ]
        detail: { type: string }
        retryable: { type: boolean }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
